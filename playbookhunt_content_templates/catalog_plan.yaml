# Popular Use Cases (homepage carousel → /use-cases/<slug>) and Starter kits (→ /k/<slug>).
# A use case groups playbooks across categories by user goal; a starter kit is a small ordered bundle.

use_cases:
  - slug: cut-monthly-bills
    title: Cut monthly bills
    description: Lower recurring bills with playbooks people have actually used.
    gradient: ["#2F4F46", "#5E7F73"] # tile background (dark → light)
    sort: 1
    playbooks:
      [
        lower-your-internet-bill,
        cut-your-phone-bill,
        cheaper-car-insurance,
        cancel-unused-subscriptions,
        lower-your-energy-bill,
      ]
  - slug: cheaper-flights
    title: Cheaper flights
    description: Find, book and rebook flights for less.
    gradient: ["#8A5A1F", "#C0925A"]
    sort: 2
    playbooks:
      [
        cheapest-flight-to-europe,
        find-award-flights-with-points,
        claim-flight-delay-compensation,
      ]
  - slug: plan-a-trip
    title: Plan a trip
    description: Itineraries, checklists and packing lists tuned to you.
    gradient: ["#3E3F63", "#7E7FA6"]
    sort: 3
    playbooks:
      [
        plan-7-days-in-japan,
        weekend-city-break-itinerary,
        family-trip-with-kids,
      ]
  - slug: doctor-visit-prep
    title: Doctor visit prep
    description: Walk into appointments prepared (not medical advice).
    gradient: ["#4A6670", "#8FA9B0"]
    sort: 4
    playbooks:
      [prepare-questions-for-my-doctor, appeal-an-insurance-claim-denial]
  - slug: research-competitors
    title: Research competitors
    description: Structured competitor and pricing research for small businesses.
    gradient: ["#6B3B4E", "#A5708A"]
    sort: 5
    playbooks: [research-my-competitors, pricing-analysis]
